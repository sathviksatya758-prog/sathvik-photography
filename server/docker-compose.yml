name: sathvik-photography

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sathvik
      POSTGRES_PASSWORD: sathvik
      POSTGRES_DB: sathvik_portfolio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sathvik -d sathvik_portfolio']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible local object storage — swap for real S3/R2/Supabase
  # in production by pointing S3_ENDPOINT at them instead.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the local bucket and makes it public-read, since
  # renditions are served directly from CDN_BASE without presigning.
  # In production, configure this via your provider's console instead.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/sathvik-portfolio &&
      mc anonymous set download local/sathvik-portfolio
      "

  # Catches outgoing dev email (verification/reset/contact) at
  # http://localhost:1080 instead of sending anything real.
  maildev:
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - '1080:1080' # web UI
      - '1025:1025' # SMTP

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sathvik:sathvik@postgres:5432/sathvik_portfolio
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: maildev
      SMTP_PORT: 1025
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ['node', 'dist/jobs/worker.js']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sathvik:sathvik@postgres:5432/sathvik_portfolio
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: maildev
      SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
